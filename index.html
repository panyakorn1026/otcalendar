:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D5DCE3;
  --ink:#15202B; --muted:#5B6875; --faint:#8A96A3;
  --ot:#1C6E8C; --ot-soft:#DCEEF4; --ex:#C8661B; --ex-soft:#FBE8D8;
  --danger:#B3261E; --focus:#1C6E8C; --hol:#A3212B; --hol-soft:#F7E3E4;
  --per:#E3F1F6; --per-hover:#D2E8F0; --per-out:#D9E6EC;
  --xl-ot:#CFE8A9; --xl-sun:#F6C4C4; --xl-hol:#F7CDF7; --off:#E4E7EB;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161C; --surface:#18212A; --surface-2:#212C37; --line:#2E3B48;
    --ink:#E6ECF1; --muted:#9AA7B4; --faint:#6E7B88;
    --ot:#5DB3D2; --ot-soft:#16323E; --ex:#EE9A55; --ex-soft:#3A2616;
    --danger:#F2847C; --focus:#5DB3D2; --hol:#F08A92; --hol-soft:#3A1C20; --per:#1B3845; --per-hover:#214251; --per-out:#172E38; --xl-ot:#2E4A1B; --xl-sun:#4A1D21; --xl-hol:#472445; --off:#2A333D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161C; --surface:#18212A; --surface-2:#212C37; --line:#2E3B48;
  --ink:#E6ECF1; --muted:#9AA7B4; --faint:#6E7B88;
  --ot:#5DB3D2; --ot-soft:#16323E; --ex:#EE9A55; --ex-soft:#3A2616;
  --danger:#F2847C; --focus:#5DB3D2; --hol:#F08A92; --hol-soft:#3A1C20; --per:#1B3845; --per-hover:#214251; --per-out:#172E38; --xl-ot:#2E4A1B; --xl-sun:#4A1D21; --xl-hol:#472445; --off:#2A333D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:24px 48px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin-inline:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ot);border-color:var(--ot);color:#fff}
[data-theme="dark"] .btn.primary{color:#0B1A22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1A22}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
textarea{resize:vertical;min-height:64px}
.t24{display:flex;align-items:center;gap:4px}
.t24 select{font-family:var(--mono);font-variant-numeric:tabular-nums;padding:9px 2px;text-align:center;text-align-last:center;min-width:0;flex:1;-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:none;font-size:15px;cursor:pointer}
.t24 span{font-family:var(--mono);font-weight:600;color:var(--muted)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.sun-note{font-size:13px;border-radius:8px;padding:8px 12px;background:var(--ex-soft);color:var(--ex)}

/* ---- Login ---- */
#login{min-height:calc(100vh - 80px);display:grid;place-items:center}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:18px}
.stamp{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.logo{display:inline-block;border-radius:50%;background-color:#fff;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 0 0 1px var(--line);flex:none}
.login-logo{display:flex;justify-content:center;margin-bottom:-4px}
.login-logo .logo{width:112px;height:112px;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(0,0,0,.12)}
.who .logo{width:42px;height:42px}
.login-card h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.login-card p{margin:0;color:var(--muted);font-size:14px}
#empCode{font-family:var(--mono);font-size:22px;letter-spacing:.12em;text-align:center;padding:12px}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0}
.step{display:grid;gap:10px}
.pin-in{font-family:var(--mono)!important;font-size:22px!important;letter-spacing:.35em;text-align:center;padding:10px!important}
.pin2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin2 .pin-in{font-size:18px!important;letter-spacing:.25em}
.step-note{margin:0;font-size:13px;color:var(--ink);background:var(--ot-soft);border-radius:8px;padding:10px 12px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--ot);cursor:pointer;justify-self:end;text-decoration:underline;text-underline-offset:2px}
.danger-link{color:var(--danger);justify-self:start}
.login-btns{display:flex;gap:8px}
.login-btns #loginBtn{flex:1}
input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.p-pin{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--ex);background:var(--ex-soft);border-radius:4px;padding:0 5px;vertical-align:1px}
.rule-note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}

/* ---- App ---- */
.export{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;margin-bottom:20px;border-style:dashed}
.export .ex-title{font-weight:600}
.export .ex-sub{font-size:13px;color:var(--muted)}
.export .ex-btns{display:flex;flex-wrap:wrap;gap:8px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.who{display:flex;align-items:center;gap:12px}
.badge{font-family:var(--mono);background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 10px;font-weight:600;letter-spacing:.06em}
.who-name{font-weight:600}
.who-sub{font-size:13px;color:var(--muted)}
/* เลย์เอาต์: ปฏิทินซ้าย 70% · กรอกข้อมูลขวา 30% (อย่างน้อย 360px) */
.grid-main{display:grid;grid-template-columns:minmax(0,7fr) minmax(360px,3fr);gap:20px;align-items:start}
#calendar{grid-column:1;grid-row:1}
.top-row{grid-column:2;grid-row:1;display:grid;gap:20px;position:sticky;top:16px}
#topRow[hidden] ~ #calendar{grid-column:1/-1}
/* หัวหน้า: รายชื่อพนักงานซ้าย · ปฏิทินกลาง · ฟอร์มขวา */
.grid-main.admin{grid-template-columns:250px minmax(0,7fr) minmax(360px,3fr)}
#peoplePanel{grid-column:1;grid-row:1;position:sticky;top:16px;display:grid;grid-template-rows:auto minmax(0,1fr);max-height:calc(100vh - 32px);overflow:hidden}
.grid-main.admin #calendar{grid-column:2}
.grid-main.admin .top-row{grid-column:3}
.grid-main.admin #topRow[hidden] ~ #calendar{grid-column:2/-1}
.people-head{padding:14px 14px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.people-head h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.people-head input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.people-list{overflow-y:auto;padding:6px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;color:inherit;font:inherit}
.person:hover{background:var(--surface-2)}
.person[aria-selected="true"]{background:var(--ot-soft);box-shadow:inset 3px 0 0 var(--ot)}
.person .p-no{grid-row:1/3;font-family:var(--mono);font-size:12px;color:var(--faint);min-width:1.6em;text-align:right;padding-top:1px}
.person .p-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .p-name small{font-family:var(--mono);font-weight:500;font-size:11.5px;color:var(--faint);margin-left:6px}
.person .p-sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.people-empty{padding:12px;color:var(--muted);font-size:13px}
.cal-who{font-size:13px;color:var(--muted);margin-top:2px}
.edit-for{margin:0;font-size:13px;font-weight:600;color:var(--ot);background:var(--ot-soft);border-radius:6px;padding:4px 10px;justify-self:start}
@media (max-width:1200px){
  .grid-main.admin{grid-template-columns:minmax(0,7fr) minmax(360px,3fr)}
  #peoplePanel{grid-column:1/-1;grid-row:1;position:static;max-height:300px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-head h2{margin:0;font-size:18px}
.cal-nav{display:flex;gap:4px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:12px;color:var(--faint);text-align:center;padding:8px 0;font-weight:600;letter-spacing:.04em}
.dow div:first-child,.dow div:last-child{color:var(--ex)}
.days{border-top:1px solid var(--line)}
.day{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border-top:0;border-left:0;cursor:pointer;border-radius:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day.out{background:var(--bg);cursor:pointer;color:var(--faint)}
.day.out:hover{background:var(--surface-2)}
.day .d{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}
.day.today .d{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;align-self:flex-start}
.day.sel{box-shadow:inset 0 0 0 2px var(--ot)}
.day{position:relative}
.day-del{position:absolute;top:4px;right:4px;min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--faint);cursor:pointer;opacity:0;transition:opacity .15s}
.day:hover .day-del,.day.sel .day-del,.day-del:focus-visible{opacity:1}

.day-del:hover{background:var(--hol-soft);color:var(--danger)}
.day.inper{background:var(--per)}
.day.inper:hover{background:var(--per-hover)}
.day.out.inper{background:var(--per-out)}
.day.out.inper:hover{background:var(--per-hover)}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;align-self:flex-start;white-space:nowrap}
.chip.ot{background:var(--ot-soft);color:var(--ot)}
.chip.ex{background:var(--ex-soft);color:var(--ex)}
.chip.off{background:var(--xl-sun);color:var(--danger)}
.chip.noot{background:var(--off);color:var(--muted)}
.day .d-row{display:flex;align-items:center;gap:4px;min-width:0}
.day.sun .d{color:var(--hol)}
.day.holiday .d{align-self:flex-start;color:var(--hol);border:1.5px solid var(--hol);border-radius:50%;min-width:24px;height:24px;display:inline-grid;place-items:center;padding:0 2px}
.day.holiday.today .d{background:var(--hol);color:#fff;border-radius:50%}
.day .hol-name{font-size:10.5px;line-height:1.3;color:var(--hol);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hol-tag{display:inline-block;font-size:13px;font-weight:600;color:var(--hol);background:var(--hol-soft);border-radius:6px;padding:2px 10px;margin-top:4px}
.day .note-dot{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
@media (max-width:560px){
  .day{min-height:62px;padding:4px}
  .chip{font-size:10px;padding:0 4px}
  .day .note-dot,.day .hol-name{display:none}
  .day.holiday .d{min-width:20px;height:20px}
}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

.summary{padding:16px;display:grid;gap:14px}
.summary h3,.editor h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.stat.ot b{color:var(--ot)} .stat.ex b{color:var(--ex)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);display:flex;overflow:hidden}
.bar i{display:block;height:100%}

.editor{padding:16px;display:grid;gap:14px}
.editor .date-title{font-size:16px;font-weight:600;margin:0}
.ed-head{display:grid;gap:4px}
.ed-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.ed-fields .split,.ed-fields .ed-hours{grid-column:1/-1}
.ed-fields input[type=date]{font-family:var(--mono);font-size:13.5px;padding:8px 8px}
.mode{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{border:0;background:var(--surface);padding:8px 4px;font:inherit;font-weight:600;font-size:13.5px;line-height:1.3;color:var(--muted);cursor:pointer}
.mode button+button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"]{background:var(--ot);color:#fff}
.mode button#modeNoOt[aria-pressed="true"]{background:var(--muted);color:var(--surface)}
.mode button#modeOff[aria-pressed="true"]{background:var(--danger);color:#fff}
.off-note{margin:0;font-size:13px;color:var(--muted);background:var(--off);border-radius:8px;padding:10px 12px}
/* ---- ตารางรวม (หัวหน้า) ---- */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:18px;font-family:var(--mono);font-weight:600}
.sheet-nav{display:flex;align-items:center;gap:6px}
.sheet-hint{font-size:12.5px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line)}
.sheet-wrap{overflow:auto;max-height:calc(100vh - 230px)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:32px;padding:0 6px;text-align:center;white-space:nowrap;background:var(--surface)}
.sheet thead th{position:sticky;top:0;z-index:2;font-weight:600;font-size:12px;background:var(--surface-2)}
.sheet thead tr:nth-child(2) th{top:32px}
.sheet thead th.sun{color:var(--hol)}
.sheet .fix{position:sticky;z-index:1}
.sheet thead .fix{z-index:3}
.sheet .c0{left:0;min-width:40px;width:40px}
.sheet .c1{left:40px;min-width:78px;width:78px;font-family:var(--mono)}
.sheet .c2{left:118px;min-width:84px;width:84px;font-weight:600}
.sheet .c3{left:202px;min-width:200px;width:200px;text-align:left;border-right:2px solid var(--line)}
.sheet td.cell{min-width:40px;width:40px;padding:0;cursor:cell;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet td.cell.sun{background:var(--xl-sun)}
.sheet td.cell.hol{background:var(--xl-hol)}
.sheet td.cell.ot{background:var(--xl-ot);font-weight:600}
.sheet td.cell.off{background:var(--xl-sun);color:var(--danger);font-family:var(--sans);font-size:12px;font-weight:600}
.sheet td.cell.noot{color:var(--muted);font-weight:600}
.sheet td.cell:not(.ro):hover{box-shadow:inset 0 0 0 2px var(--ot)}
.sheet td.cell.ro{cursor:default}
.sheet tr.grp td{background:var(--surface-2);height:28px;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-align:left;color:var(--ink)}
.sheet tr.grp td.grp-cell{padding-left:10px;width:auto;min-width:0}
.sheet tr.me td.fix{background:var(--ot-soft);color:var(--ot)}
.sheet tr.me td{border-bottom-color:var(--ot)}
.sheet td.cell.saving{opacity:.55}
.sheet td.tot{font-family:var(--mono);font-weight:600;min-width:84px;border-left:2px solid var(--line)}
.sheet .cell-in{width:100%;height:30px;border:0;outline:2px solid var(--ot);outline-offset:-2px;text-align:center;font:inherit;background:var(--surface);color:var(--ink);padding:0}
.sheet-empty{padding:20px 16px;color:var(--muted)}
/* ---- ลายเซ็นผู้อนุมัติ ---- */
dialog.sig{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}

.sig-body h3{margin:0;font-size:17px}

.sig-pad{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;display:block}
.sig-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.sig-row > div{display:flex;flex-wrap:wrap;gap:8px}
.sig-state{font-size:12.5px;color:var(--muted)}
/* ---- โดเนท (หน้าเข้าสู่ระบบ) ---- */
.donate{position:fixed;right:20px;bottom:20px;z-index:5}
.donate-card{display:grid;justify-items:center;gap:6px;width:150px;padding:10px 10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}

.appr-badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 10px;margin-top:6px}

.appr-badge.no{background:var(--off);color:var(--muted)}
.appr-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}

.appr-seg button+button{border-left:1px solid var(--line)}
.appr-seg button[aria-pressed="true"][data-on="0"]{background:var(--ink);color:var(--bg)}
.appr-seg button[aria-pressed="true"][data-on="1"]{background:var(--ot);color:#fff}
.appr-seg button:disabled{opacity:.6;cursor:wait}
.sheet-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sheet-tools .appr-badge{margin-top:0}
.act-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.act-btns .confirm{flex-basis:100%}
.act-btns #saveBtn{flex:1}
#delWrap{display:contents}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{border-radius:8px;padding:8px 10px}
.split .s-ot{background:var(--ot-soft);color:var(--ot)}
.split .s-ex{background:var(--ex-soft);color:var(--ex)}
.split small{display:block;font-size:12px;opacity:.85}
.split b{font-family:var(--mono);font-size:18px;line-height:1.2}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);letter-spacing:.03em}
.lang button+button{border-left:1px solid var(--line)}
.flag{width:16px;height:16px;border-radius:50%;overflow:hidden;flex:none;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.flag svg{width:100%;height:100%;display:block}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.login-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  $("sheetTable").addEventListener("click", ev => {

  function startEdit(td){
    const e = sheetData[td.dataset.code + "|" + td.dataset.date];
    const cur = e ? (e.status === "off" ? "x" : e.status === "noot" ? "-" : fmt(e.hours)) : "";
    const inp = document.createElement("input"); inp.className = "cell-in"; inp.value = cur; inp.inputMode = "decimal";
    td.textContent = ""; td.appendChild(inp); inp.focus(); inp.select();
    let done = false;
    const finish = (commit, move) => {
      if (done) return; done = true;
      if (commit) commitCell(td, inp.value); else paintCell(td);
      if (move) { const next = move(td); if (next && next.classList.contains("cell") && canEdit(next.dataset.code)) startEdit(next); }
    };
    const down = c => { let tr = c.parentElement.nextElementSibling; while (tr && tr.classList.contains("grp")) tr = tr.nextElementSibling; return tr ? tr.children[c.cellIndex] : null; };
    const right = c => { const n = c.nextElementSibling; return n && n.classList.contains("cell") ? n : null; };
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); finish(true, down); }
      else if (ev.key === "Tab") { ev.preventDefault(); finish(true, ev.shiftKey ? c => { const pv = c.previousElementSibling; return pv && pv.classList.contains("cell") ? pv : null; } : right); }

  }
  async function commitCell(td, raw){
    const code = td.dataset.code, k = td.dataset.date, key = code + "|" + k, prev = sheetData[key];
    const v = raw.trim().toLowerCase();
    let next;
    if (v === "") next = null;
    else if (v === "x" || v === "off" || v === "หยุด") next = { ...(prev || { note: "" }), hours: 0, start: null, end: null, endDate: null, status: "off" };
    else if (v === "-") next = { ...(prev || { note: "" }), hours: 0, start: null, end: null, endDate: null, status: "noot" };
    else {
      const h = parseFloat(v.replace(",", "."));
      if (!(h > 0) || h > 24 || !/^\d+([.,]\d+)?$/.test(v)) { toast(t("errCell")); paintCell(td); return; }
      const hh = Math.round(h * 2) / 2;
      next = prev && !isNoWork(prev) ? { ...prev, hours: hh } : { hours: hh, start: null, end: null, endDate: null, note: prev ? prev.note : "", status: "ot" };
    }
    const same = (!prev && !next) || (prev && next && prev.status === next.status && prev.hours === next.hours);
    if (same) { paintCell(td); return; }
    if (next) sheetData[key] = next; else delete sheetData[key];
    paintCell(td); paintTotal(td.parentElement); td.classList.add("saving");
    try {
      if (next) await rpc("ot_save", { p_code: code, p_date: k, p_hours: next.hours, p_start: next.start || "", p_end: next.end || "", p_note: next.note || "", p_end_date: next.endDate || null, p_status: next.status });
      else await rpc("ot_delete", { p_code: code, p_date: k });
    } catch {
      if (prev) sheetData[key] = prev; else delete sheetData[key];
      toast(t("saveFail"));
    }
    if (td.isConnected) { paintCell(td); paintTotal(td.parentElement); }
  }

  // ---------- ลายเซ็นผู้อนุมัติ (วาด/อัปโหลด แล้วเก็บใน Supabase) ----------
  const sigCv = $("sigPad"), pctx = sigCv.getContext("2d");
  let sigInk = false, sigSaved = null;
  function sizePad(){
    const r = sigCv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    sigCv.width = Math.round(r.width * dpr); sigCv.height = Math.round(r.height * dpr);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.fillStyle = "#fff"; pctx.fillRect(0, 0, r.width, r.height);
    pctx.lineWidth = 2.4; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = "#111";
  }
  function drawImageFit(src){
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        sizePad(); const r = sigCv.getBoundingClientRect();
        const sc = Math.min((r.width - 16) / img.width, (r.height - 16) / img.height, 1);
        const w = img.width * sc, h = img.height * sc;
        pctx.drawImage(img, (r.width - w) / 2, (r.height - h) / 2, w, h); sigInk = true; res();
      };
      img.onerror = () => res();
      img.src = src;
    });
  }
  let drawing = false, last = null;
  const pt = ev => { const r = sigCv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  sigCv.addEventListener("pointerdown", ev => { drawing = true; last = pt(ev); sigCv.setPointerCapture(ev.pointerId); pctx.beginPath(); pctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); pctx.fillStyle = "#111"; pctx.fill(); sigInk = true; });
  sigCv.addEventListener("pointermove", ev => { if (!drawing) return; const p = pt(ev); pctx.beginPath(); pctx.moveTo(last.x, last.y); pctx.lineTo(p.x, p.y); pctx.stroke(); last = p; });
  ["pointerup","pointercancel","pointerleave"].forEach(n => sigCv.addEventListener(n, () => { drawing = false; }));
  // ตัดขอบขาวรอบลายเซ็นออก ให้ไปวางในไฟล์ Excel ได้พอดี
  function croppedPng(){
    const w = sigCv.width, h = sigCv.height, d = pctx.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y*w + x) * 4; if (d[i] < 200 || d[i+1] < 200 || d[i+2] < 200) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return null;
    const m = 6, cx = Math.max(0, x0 - m), cy = Math.max(0, y0 - m), cw = Math.min(w, x1 + m) - cx, ch = Math.min(h, y1 + m) - cy;
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cw, ch); g.drawImage(sigCv, cx, cy, cw, ch, 0, 0, cw, ch);
    return c.toDataURL("image/png");
  }

  // ---------- อนุมัติรายรอบ (ลายเซ็นขึ้นใน Excel เฉพาะรอบที่อนุมัติ) ----------
  const approvals = {};    // { "YYYY-MM-16": {approved_by, approved_at} | null }
  let apprBusy = false;
  async function loadApproval(force){
    if (!me || !me.admin) return;
    const per = periodOf(selected);
    if (force || !(per.start in approvals)) {
      try { const r = await rpc("ot_approval_list", { p_admin: me.code, p_from: per.start, p_to: per.start }); approvals[per.start] = (r && r[0]) || null; }
      catch { /* แสดงสถานะเดิม */ }
    }
    paintApproval();
  }
  function paintApproval(){
    if (!me || !me.admin) return;
    const per = periodOf(selected), known = per.start in approvals, rec = approvals[per.start];
    let txt = "", cls = "appr-badge js-appr-status";
    if (known && rec) {
      const d = new Date(rec.approved_at);
      txt = t("apprYes", { d: `${thDate(ymd(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}` }); cls += " ok";
    } else if (known) { txt = t("apprNo"); cls += " no"; }
    document.querySelectorAll(".js-appr-status").forEach(el => { el.className = cls; el.textContent = txt; el.hidden = !txt; });
    document.querySelectorAll(".js-appr-seg").forEach(g => {
      g.hidden = !me.approver || !known;
      g.querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", String((b.dataset.on === "1") === !!rec)); b.disabled = apprBusy; });
    });
  }
  document.querySelectorAll(".js-appr-seg button").forEach(b => b.addEventListener("click", async () => {
    if (!me || !me.approver || apprBusy) return;
    const per = periodOf(selected), on = b.dataset.on === "1";
    if (on === !!approvals[per.start]) return;          // กดปุ่มที่เลือกอยู่แล้ว ไม่ต้องทำอะไร
    apprBusy = true; paintApproval();
    try {
      await rpc("ot_approve", { p_code: me.code, p_start: per.start, p_end: per.end, p_on: on });
      approvals[per.start] = on ? { approved_by: me.code, approved_at: new Date().toISOString() } : null;
      toast(on ? t("apprDone", { a: thDate(per.start), b: thDate(per.end) }) : t("apprUndone"));
    } catch { toast(t("saveFail")); }
    finally { apprBusy = false; paintApproval(); }
  }));

  // ---------- Export for supervisors ----------
  function updateExportLabels(){
    const p = periodOf(selected);
    loadApproval();
    $("exMonth").textContent = t("exPeriod", {a: thDate(p.start), b: thDate(p.end)});
    $("exYear").textContent = t("exYear", {y: yr(view.getFullYear())});
  }
  // ---------- ส่งออก Excel (.xlsx) ตามแบบฟอร์ม "รายชื่อ OT Survey ประจำสำนักงานใหญ่" ----------
  const EXCELJS_URL = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
  const XL = {
    title: "รายชื่อ OT Survey ประจำสำนักงานใหญ่", dept: "Survey",
    approver: { name: "Mr. Benigno Borja Jr", position: "Survey Manager" },   // ผู้อนุมัติท้ายตาราง
    font: "Times New Roman",
    green: "FF92D050", yellow: "FFFFFF00", red: "FFFF0000", pink: "FFFF99FF"
  };
  const MON_EN = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const DOW_XL = ["Su","M","T","W","Th","F","S"];
  let excelLib = null;
  function loadExcelJS(){
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (!excelLib) excelLib = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = EXCELJS_URL;
      s.onload = () => res(window.ExcelJS); s.onerror = () => { excelLib = null; rej(new Error("exceljs")); };
      document.head.appendChild(s);
    });
    return excelLib;
  }
  const enDate = k => { const [y,m,d] = k.split("-"); return `${+d} ${MON_EN[+m-1]} ${y}`; };
  const datesBetween = (a, b) => { const out = []; for (const d = new Date(a+"T00:00:00"), e = new Date(b+"T00:00:00"); d <= e; d.setDate(d.getDate()+1)) out.push(ymd(d)); return out; };
  function saveBlob(filename, blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function addPeriodSheet(wb, per, emps, hoursOf, sig){
    const [sy,sm,sd] = per.start.split("-"), [ey,em,ed] = per.end.split("-");
    const name = `${+sd}${MON_EN[+sm-1]}-${+ed}${MON_EN[+em-1]} ${ey}`;
    const ws = wb.addWorksheet(name, {
      views: [{ state: "frozen", xSplit: 6, ySplit: 4 }],
      pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
    });
    const dates = datesBetween(per.start, per.end);
    const D0 = 7, nD = dates.length, cTot = D0 + nD, cRem = cTot + 1;
    const thin = { style: "thin" }, dot = { style: "dotted" };
    const box = { top: thin, left: thin, bottom: thin, right: thin };
    const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
    const center = { horizontal: "center", vertical: "middle", wrapText: true };
    const put = (r, c, v, o = {}) => {
      const cell = ws.getCell(r, c); cell.value = v;
      cell.font = { name: XL.font, size: 11, bold: !!o.bold, color: o.color ? { argb: o.color } : undefined };
      cell.alignment = o.align || center;
      if (o.fill) cell.fill = fill(o.fill);
      cell.border = o.border || box;
      return cell;
    };

    // ความกว้างคอลัมน์
    [6, 11, 7, 26, 13, 19].forEach((w, i) => ws.getColumn(i+1).width = w);
    for (let i = 0; i < nD; i++) ws.getColumn(D0+i).width = 5.5;
    ws.getColumn(cTot).width = 13; ws.getColumn(cRem).width = 24;
    ws.getRow(2).height = 22; ws.getRow(3).height = 20; ws.getRow(4).height = 20;

    // หัวตาราง
    ws.mergeCells(2, 1, 2, 6); put(2, 1, XL.title, { bold: true });
    ws.mergeCells(3, 1, 3, 6); put(3, 1, XL.dept, { bold: true, fill: XL.yellow });
    ["NO.","ID","TITLE","NAME","NICKNAME","POSITION"].forEach((h, i) => put(4, i+1, h));
    ws.mergeCells(2, D0, 2, cTot-1); put(2, D0, `${enDate(per.start)} - ${enDate(per.end)}`, { bold: true, fill: XL.green });
    dates.forEach((k, i) => {
      const dow = new Date(k+"T00:00:00").getDay(), red = dow === 0 ? "FFFF0000" : undefined;
      put(3, D0+i, +k.slice(8), { bold: true, color: red });
      put(4, D0+i, DOW_XL[dow], { bold: true, color: red });
    });
    ws.mergeCells(2, cTot, 4, cTot); put(2, cTot, { richText: [
      { text: "TOTAL OT\n", font: { name: XL.font, size: 11, bold: true } },
      { text: "3hr+Extra", font: { name: XL.font, size: 10, bold: true } } ] }, { fill: XL.yellow });
    ws.mergeCells(2, cRem, 4, cRem); put(2, cRem, "REMARK", { bold: true, fill: XL.yellow });
    // ขอบของช่องที่ถูกรวม
    for (let r = 2; r <= 4; r++) for (const c of [cTot, cRem]) ws.getCell(r, c).border = box;
    for (let c = D0; c < cTot; c++) ws.getCell(2, c).border = box;

    // รายชื่อพนักงาน
    emps.forEach((e, idx) => {
      const r = 5 + idx; ws.getRow(r).height = 18;
      [idx+1, e.code, e.title, e.name, e.nickname, e.position].forEach((v, i) => put(r, i+1, v || ""));
      let ot = 0, ex = 0;
      dates.forEach((k, i) => {
        const en = hoursOf(e.code, k), dow = new Date(k+"T00:00:00").getDay();
        const isOff = !!en && en.status === "off", isNoOt = !!en && en.status === "noot", h = en && !isOff && !isNoOt ? en.hours : 0;
        const isHol = !!HOL_I18N[k];
        let bg = dow === 0 ? XL.red : isHol ? XL.pink : null;
        if (isOff) bg = XL.red;                                     // หยุดงาน = ช่องสีแดง (Day off)
        if (h > 0) { const s = split(h); ot += s.ot; ex += s.ex; bg = XL.green; }
        put(r, D0+i, h > 0 ? h : isNoOt ? "-" : null, { fill: bg, border: { top: dot, bottom: dot, left: dot, right: dot } });
      });
      put(r, cTot, `${fmt(ot)}+${fmt(ex)}`);
      put(r, cRem, "");
    });
    const last = 4 + emps.length;
    // เส้นขอบนอกของโซนวันที่ให้เป็นเส้นทึบ
    for (let i = 0; i < nD; i++) { const c = ws.getCell(last, D0+i); c.border = { ...c.border, bottom: thin }; }
    for (let r = 5; r <= last; r++) {
      const a = ws.getCell(r, D0); a.border = { ...a.border, left: thin };
      const b = ws.getCell(r, cTot-1); b.border = { ...b.border, right: thin };
    }

    // คำอธิบายสี + ผู้อนุมัติ
    const L0 = last + 3, none = {};
    put(L0, 2, "Remark :", { border: none, align: { horizontal: "right", vertical: "middle" } });
    ws.mergeCells(L0, 3, L0, 4); put(L0, 3, "ตารางเวลาการทำงาน", { fill: XL.yellow }); ws.getCell(L0, 4).border = box;
    [[XL.green, "", "Overtime"], [XL.red, "", "Day off"], [XL.pink, "", "Public Holiday"], [null, "-", "Leave /no have Overtime"]]
      .forEach(([bg, sym, label], i) => { put(L0+1+i, 3, sym, { fill: bg }); put(L0+1+i, 4, label); });
    put(L0+5, 2, "Remark :", { border: none, align: { horizontal: "right", vertical: "middle" } });
    const A0 = D0, A1 = Math.min(D0 + 9, cTot - 1);
    // ช่องผู้อนุมัติ: เว้น 2 แถวบนไว้เซ็นชื่อ แล้ววาง Approved By ตรงแถว Day off, ชื่อตรงแถว Public Holiday, ตำแหน่งตรงแถว Leave
    // กรอบสีขาวสำหรับเซ็นชื่อ (แถวบน Remark ถึงแถว Overtime)
    ws.mergeCells(L0-1, A0+2, L0+1, A1); put(L0-1, A0+2, "", { border: none, fill: "FFFFFFFF" });
    if (sig) {
      // วางลายเซ็นกลางกรอบขาว (กว้าง 8 คอลัมน์ × สูง 3 แถว)
      const colPx = 43, rowPx = 20, boxW = (A1 - (A0 + 2) + 1) * colPx, boxH = 3 * rowPx;
      const sc = Math.min((boxW - 10) / sig.w, (boxH - 6) / sig.h), w = sig.w * sc, h = sig.h * sc;
      ws.addImage(sig.id, { tl: { col: (A0 + 1) + (boxW - w) / 2 / colPx, row: (L0 - 2) + (boxH - h) / 2 / rowPx }, ext: { width: w, height: h }, editAs: "oneCell" });
    }
    ws.mergeCells(L0+2, A0, L0+2, A1); put(L0+2, A0, "Approved By : ....................................................................", { border: none, align: { horizontal: "left", vertical: "bottom" } });
    ws.mergeCells(L0+3, A0, L0+3, A1); put(L0+3, A0, XL.approver.name, { border: none });
    ws.mergeCells(L0+4, A0, L0+4, A1); put(L0+4, A0, XL.approver.position, { border: none });
    return ws;
  }

  async function exportAll(scope){
    if (!me || !me.admin) return;
    const y = view.getFullYear();
    // รอบเดียว = รอบของวันที่เลือก · ทั้งปี = 12 รอบที่สิ้นสุดในปีนั้น (16 ธ.ค. ปีก่อน – 15 ธ.ค.)
    const periods = scope === "month" ? [periodOf(selected)]
      : Array.from({ length: 12 }, (_, i) => ({ start: ymd(new Date(y, i-1, 16)), end: ymd(new Date(y, i, 15)) }));
    const rStart = periods[0].start, rEnd = periods[periods.length-1].end;
    const btns = [$("exMonth"), $("exYear")]; btns.forEach(b => b.disabled = true);
    $("exStatus").textContent = t("exLoading");
    try {
      const [ExcelJS, data, list, sigPng, apprList] = await Promise.all([
        loadExcelJS(),
        rpc("ot_export", { p_admin: me.code, p_from: rStart, p_to: rEnd }),
        rpc("ot_employee_list", { p_admin: me.code }),
        rpc("ot_signature_get", { p_admin: me.code }).catch(() => null),
        rpc("ot_approval_list", { p_admin: me.code, p_from: rStart, p_to: rEnd }).catch(() => [])
      ]);
      const approvedStarts = new Set((apprList || []).map(a => a.period_start));
      const hours = {}; (data || []).forEach(x => { hours[x.emp_code + "|" + x.work_date] = rowToEntry(x); });
      const emps = (list || []).map(x => ({ code: x.code, title: x.title, name: x.name, nickname: x.nickname, position: x.position }));
      (data || []).forEach(x => { if (!emps.some(e => e.code === x.emp_code)) emps.push({ code: x.emp_code, title: x.title, name: x.name, nickname: x.nickname, position: x.position }); });
      const wb = new ExcelJS.Workbook(); wb.creator = "OT Recording";
      let sig = null;
      if (typeof sigPng === "string" && sigPng.startsWith("data:image/png") && periods.some(p => approvedStarts.has(p.start))) {
        const dim = await imgSize(sigPng);
        if (dim) sig = { id: wb.addImage({ base64: sigPng, extension: "png" }), ...dim };
      }
      periods.forEach(p => addPeriodSheet(wb, p, emps, (c, k) => hours[c + "|" + k] || null, approvedStarts.has(p.start) ? sig : null));
      const buf = await wb.xlsx.writeBuffer();
      const filename = scope === "month" ? `OT_Survey_${rStart}_${t("fileTo")}_${rEnd}.xlsx` : `OT_Survey_${y}.xlsx`;
      saveBlob(filename, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      const people = new Set((data || []).map(x => x.emp_code)).size;
      $("exStatus").textContent = t("exDone", { n: (data || []).length, p: people });
    } catch (err) {
      console.error("export failed", err);
      $("exStatus").textContent = t("exFail");
    } finally { btns.forEach(b => b.disabled = false); }
  }
  $("exMonth").addEventListener("click", () => exportAll("month"));
  $("exYear").addEventListener("click", () => exportAll("year"));

  function render(){
    $("monthTitle").textContent = `${L().months[view.getMonth()]} ${yr(view.getFullYear())}`;
    const first = new Date(view), y = first.getFullYear(), m = first.getMonth();
    const start = new Date(y, m, 1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
    const today = ymd(new Date());
    const per = periodOf(selected);
    $("lgPerRange").textContent = `(${thDate(per.start)} – ${thDate(per.end)})`;
    const box = $("days"); box.innerHTML = "";
    for (let i = 0; i < weeks*7; i++) {
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = ymd(d), inMonth = d.getMonth() === m;
      const b = document.createElement("button"); b.type="button";
      const hol = inMonth ? holName(key) : null;
      b.className = "day" + (inMonth ? "" : " out") + (hol ? " holiday" : "") + (inMonth && d.getDay()===0 ? " sun" : "") + (key===today ? " today" : "") + (inMonth && key===selected ? " sel" : "") + (key >= per.start && key <= per.end ? " inper" : "");
      const dn = document.createElement("span"); dn.className="d"; dn.textContent=d.getDate(); b.appendChild(dn);
      if (hol) { const hn=document.createElement("span"); hn.className="hol-name"; hn.textContent=hol; b.appendChild(hn); }
      if (inMonth) {
        const e = entries[key];
        if (hasEntry(e)) {
          if (isNoWork(e)) {
            const off = e.status === "off";
            const c0 = document.createElement("span"); c0.className = "chip " + (off ? "off" : "noot"); c0.textContent = t(off ? "offChip" : "nootChip"); b.appendChild(c0);
          } else {
            const s = split(e.hours);
            const c1 = document.createElement("span"); c1.className="chip ot"; c1.textContent=`OT ${fmt(s.ot)}`; b.appendChild(c1);
            if (s.ex > 0){ const c2=document.createElement("span"); c2.className="chip ex"; c2.textContent=`EX ${fmt(s.ex)}`; b.appendChild(c2); }
          }
          if (e.note){ const n=document.createElement("span"); n.className="note-dot"; n.textContent=e.note; b.appendChild(n); }
          if (target) {
            // ปุ่มลบในช่องปฏิทิน: กดครั้งเดียวลบทันที
            const x = document.createElement("span"); x.className = "day-del";
            x.setAttribute("role","button"); x.tabIndex = 0; x.setAttribute("aria-label", t("delCellAria"));
            x.textContent = "×";
            const act = ev => { ev.stopPropagation(); ev.preventDefault(); deleteEntry(key); };
            x.addEventListener("click", act);
            x.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") act(ev); });
            b.appendChild(x);
          }
        }
        b.setAttribute("aria-label", `${d.getDate()} ${L().months[m]}` + (hol ? ` ${hol}` : "") + (e && e.status === "off" ? " " + t("modeOff") : e && e.status === "noot" ? " " + t("modeNoOt") : e && e.hours ? " " + t("ariaOt", {h: fmt(e.hours)}) : ""));
        b.addEventListener("click", () => { selected = key; render(); if (!target) return; const f=$("editor"); if (f.getBoundingClientRect().top < 0) f.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); $("edHours").focus({preventScroll:true}); });
      } else {
        // วันของเดือนอื่น: กดแล้วข้ามไปเดือนนั้นและเลือกวันนั้นเลย
        b.setAttribute("aria-label", `${d.getDate()} ${L().months[d.getMonth()]} ${yr(d.getFullYear())}`);
        b.addEventListener("click", () => { selected = key; view = new Date(d.getFullYear(), d.getMonth(), 1); loadMonth(); });
      }
      box.appendChild(b);
    }
    fillEditor(); renderSummary(); updateWho(); if (me && me.admin) updateExportLabels();
  }

  function renderSummary(){
    if (!target) return;
    const p = periodOf(selected);
    $("sumTitle").textContent = t("sumTitle");
    $("sumRange").textContent = `${thDate(p.start)} – ${thDate(p.end)}`;
    let ot=0, ex=0, days=0, offs=0, noots=0;
    for (const [k,e] of Object.entries(entries)) {
      if (k < p.start || k > p.end) continue;
      if (e.status === "off") { offs++; continue; }
      if (e.status === "noot") { noots++; continue; }
      if (!(e.hours > 0)) continue;
      const s=split(e.hours); ot+=s.ot; ex+=s.ex; days++;
    }
    const extra = [noots ? t("nootDays", { n: noots }) : "", offs ? t("offDays", { n: offs }) : ""].filter(Boolean);
    $("sumOff").textContent = extra.length ? extra.join(" · ") + " " + t("inPeriod") : "";
    $("sumOt").textContent = fmt(ot); $("sumEx").textContent = fmt(ex); $("sumDays").textContent = days;
    const tot = ot+ex || 1;
    $("barOt").style.width = (ot/tot*100)+"%"; $("barEx").style.width = (ex/tot*100)+"%";
  }

  function fillEditor(){
    if (!selected.startsWith(monthKey())) selected = `${monthKey()}-01`;
    const d = new Date(selected + "T00:00:00");
    $("edDate").textContent = t("edDate", {dow: L().dow[d.getDay()], d: d.getDate(), m: L().months[d.getMonth()], y: yr(d.getFullYear())});
    const hol = holName(selected); $("edHol").hidden = !hol; $("edHol").textContent = hol ? t("holTag", {h: hol}) : "";
    const e = entries[selected];
    setMode(e && isNoWork(e) ? e.status : "ot");
    setT("edStart", e ? (e.start || "") : ""); setT("edEnd", e ? (e.end || "") : "");
    $("edStartDate").value = selected;
    $("edEndDate").min = selected; $("edEndDate").max = addDays(selected, 2);
    $("edEndDate").value = e && e.endDate ? e.endDate : (e && e.start && e.end && e.end <= e.start ? addDays(selected, 1) : selected);
    endTouched = !!(e && e.endDate && e.endDate !== selected);
    $("edHint").textContent = t("hint");
    $("edHours").value = e && !isNoWork(e) ? (e.hours ?? "") : ""; $("edNote").value = e?.note || "";
    $("delBtn").hidden = !e; resetDel(); preview();
  }

  function preview(){
    const h = parseFloat($("edHours").value) || 0, s = split(h);
    $("pvOt").textContent = fmt(s.ot); $("pvEx").textContent = fmt(s.ex);
  }
  let edMode = "ot", endTouched = false;
  function setMode(m){
    edMode = m;
    $("modeOt").setAttribute("aria-pressed", String(m === "ot"));
    $("modeNoOt").setAttribute("aria-pressed", String(m === "noot"));
    $("modeOff").setAttribute("aria-pressed", String(m === "off"));
    document.querySelectorAll("#editor .ot-only").forEach(el => el.hidden = m !== "ot");
    $("offNote").hidden = m === "ot"; $("offNote").textContent = m === "off" ? t("offHint") : m === "noot" ? t("nootHint") : "";
  }
  $("modeOt").addEventListener("click", () => setMode("ot"));
  $("modeNoOt").addEventListener("click", () => setMode("noot"));
  $("modeOff").addEventListener("click", () => setMode("off"));
  function syncTimes(){
    const a = getT("edStart"), b = getT("edEnd"), sd = $("edStartDate").value || selected;
    if (a && b && !endTouched) $("edEndDate").value = b <= a ? addDays(sd, 1) : sd;   // เลิกหลังเที่ยงคืน → วันจบ = วันถัดไป
    const h = hoursBetween(sd, a, $("edEndDate").value || sd, b);
    if (h !== null) { $("edHours").value = h; preview(); }
  }
  $("edEndDate").addEventListener("change", () => { endTouched = true; syncTimes(); });
  $("edStartDate").addEventListener("change", () => {
    const v = $("edStartDate").value; if (!v || v === selected) return;
    const sameMonth = v.slice(0,7) === monthKey();
    selected = v;
    if (sameMonth) render(); else { const d = new Date(v + "T00:00:00"); view = new Date(d.getFullYear(), d.getMonth(), 1); loadMonth(); }
  });
  ["edStart-h","edStart-m","edEnd-h","edEnd-m"].forEach(id => $(id).addEventListener("change", syncTimes));
  $("edHours").addEventListener("input", preview);

  // บันทึกแบบแสดงผลทันที แล้วส่งขึ้น Supabase เบื้องหลัง (ถ้าไม่สำเร็จจะย้อนค่ากลับ)
  $("editor").addEventListener("submit", async e => {
    e.preventDefault();
    if (!target) return;
    const key = selected, prev = entries[key], tcode = target.code, note = $("edNote").value.trim();
    let val;
    if (edMode !== "ot") {
      val = { hours: 0, start: null, end: null, endDate: null, status: edMode, note };
    } else {
      const h = parseFloat($("edHours").value);
      if (!(h > 0) || h > 24) { toast(t("errHours")); $("edHours").focus(); return; }
      const a = getT("edStart"), b = getT("edEnd"), ed = $("edEndDate").value || key;
      if (a && b && hoursBetween(key, a, ed, b) === null) { toast(t("errEnd")); $("edEndDate").focus(); return; }
      val = { hours: Math.round(h*2)/2, start: a || null, end: b || null, endDate: a && b && ed !== key ? ed : null, status: "ot", note };
    }
    setEntry(key, val); render();
    if (val.status === "off") toast(t("savedOff"));
    else if (val.status === "noot") toast(t("savedNoOt"));
    else { const s = split(val.hours); toast(s.ex>0 ? t("savedEx", {o: fmt(s.ot), e: fmt(s.ex)}) : t("saved", {o: fmt(s.ot)})); }
    $("saveBtn").disabled = true;
    try { await rpc("ot_save", { p_code: tcode, p_date: key, p_hours: val.hours, p_start: val.start || "", p_end: val.end || "", p_note: val.note, p_end_date: val.endDate, p_status: val.status }); }
    catch { if (target && target.code === tcode) { setEntry(key, prev); render(); } toast(t("saveFail")); }
    finally { $("saveBtn").disabled = false; }
  });

  // inline confirm for delete (no browser dialogs)
  function resetDel(){ const w=$("delWrap"); const c=w.querySelector(".confirm"); if(c) c.remove(); $("delBtn").style.display=""; }
  $("delBtn").addEventListener("click", () => {
    $("delBtn").style.display="none";
    const c = document.createElement("span"); c.className="confirm";
    c.innerHTML = `${t("delQ")} <button type="button" class="btn danger" id="delYes">${t("delYes")}</button><button type="button" class="btn ghost" id="delNo">${t("cancel")}</button>`;
    $("delWrap").appendChild(c);
    $("delNo").onclick = resetDel;
    $("delYes").onclick = () => deleteEntry(selected);
  });
  async function deleteEntry(key){
    const prev = entries[key]; if (!prev || !target) return;
    const tcode = target.code;
    setEntry(key, null); render(); toast(t("deleted"));
    try { await rpc("ot_delete", { p_code: tcode, p_date: key }); }
    catch { if (target && target.code === tcode) { setEntry(key, prev); render(); } toast(t("delFail")); }
  }


  $("prevM").addEventListener("click", () => { view.setMonth(view.getMonth()-1); selected = `${monthKey()}-01`; loadMonth(); });
  $("nextM").addEventListener("click", () => { view.setMonth(view.getMonth()+1); selected = `${monthKey()}-01`; loadMonth(); });
  $("todayBtn").addEventListener("click", () => { view = new Date(); view.setDate(1); selected = ymd(new Date()); loadMonth(); });

  // language switcher
  function setLang(l){
    if (!I18N[l]) return; LANG = l; try { localStorage.setItem("ot:lang", l); } catch {}
    applyStatic();
    paintLogin(); $("loginErr").textContent = "";
    if (me) { $("whoSub").textContent = subLine(me); $("whoName").textContent = whoLine(me) || (me.admin ? t("adminName") : t("employee")); if (!$("exportBox").hidden) $("exStatus").textContent = t("exSub"); renderPeople(); render(); if (activeTab === "sheet" && sheetPer) renderSheet(); paintApproval(); }
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  applyStatic(); paintLogin();

  // จำการเข้าสู่ระบบไว้ในเครื่องนี้
  const saved = LS.get("session");
  if (saved && saved.token && configured) {
    rpc("ot_session", { p_token: saved.token })
      .then(r => { if (r && r.ok) enter(profile(r.code, r)); else { LS.del("session"); $("empCode").value = saved.code || ""; $("empCode").focus(); } })
      .catch(() => { $("empCode").focus(); });
  } else { LS.del("session"); $("empCode").focus(); }
})();
</script>
</body>
